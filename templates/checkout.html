{% extends 'base.html' %}
{% block content %}
<section class="card checkout-card" id="checkout" data-reading-id="{{ reading_id }}" data-amount="{{ product.amount }}" data-product-name="{{ product.name }}">
  <div class="eyebrow">CHECKOUT</div>
  <h1>{{ product.name }}</h1>
  <div class="checkout-price">{{ '{:,}'.format(product.amount) }}원</div>
  <p>테스트 결제 단계입니다. 결제 승인은 서버에서 금액과 주문번호를 검증하도록 연결할 예정입니다.</p>
  <button class="btn" id="pay-button">결제하기</button>
  <div id="checkout-message" class="notice"></div>
</section>
{% endblock %}
